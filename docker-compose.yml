services:
  # Laravel Application (PHP 8.3 + FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alumni_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - alumni_network

  # Nginx Web Server
  web:
    image: nginx:alpine
    container_name: alumni_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - alumni_network

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: alumni_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: alumni_db
      MYSQL_USER: alumni_user
      MYSQL_PASSWORD: alumni_secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - alumni_mysql_data:/var/lib/mysql
    networks:
      - alumni_network

  # phpMyAdmin (Optional - for visual DB management)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: alumni_pma
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      - mysql
    networks:
      - alumni_network

networks:
  alumni_network:
    driver: bridge

volumes:
  alumni_mysql_data:
    driver: local
